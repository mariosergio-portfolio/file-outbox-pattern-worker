spring:
  application:
    name: job-outbox

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    #schema: public
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  #flyway:
  #  enabled: true
  #  locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false  # don't loop on bad messages

rabbitmq:
  exchange:
    import: import.exchange
    export: export.exchange
  queue:
    import: import.queue
    export: export.queue
  routing-key:
    import: import.routing.key
    export: export.routing.key
  # How long (ms) ImportEventPublisher.publish blocks waiting for the broker's publisher confirm
  publish-confirm-timeout-ms: ${RABBITMQ_PUBLISH_CONFIRM_TIMEOUT_MS:5000}

outbox:
  # How old (in minutes) a PENDING record must be before it is considered stalled
  stale-threshold-minutes: ${OUTBOX_STALE_THRESHOLD_MINUTES:0}
  # Fixed-rate in milliseconds for the scheduled watcher (default: 60 seconds)
  schedule-rate-ms: ${OUTBOX_SCHEDULE_RATE_MS:60000}

server:
  port: 8082

logging:
  level:
    com.planet: DEBUG
